name: myCamino website

on:
  push:
    branches: [main]
    paths: ["website/**", "docs/**", ".github/workflows/mycamino-site.yml"]
  pull_request:
    paths: ["website/**", "docs/**", ".github/workflows/mycamino-site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: website/requirements.txt
      - run: pip install -r website/requirements.txt
      - run: python website/manage.py test siteapp
      - run: python website/manage.py check --deploy
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: ci-only-long-random-secret-not-used-in-production
          DJANGO_ALLOWED_HOSTS: mycamino.heinofalcke.de
          MYCAMINO_OPERATOR_NAME: CI Operator
          MYCAMINO_OPERATOR_ADDRESS: CI Address
          MYCAMINO_OPERATOR_EMAIL: ci@example.invalid

  image:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: website/Dockerfile
          push: true
          tags: ghcr.io/hfalcke/mycamino-site:main
