services:
  web:
    image: ${MYCAMINO_IMAGE:-ghcr.io/hfalcke/mycamino-site:main}
    container_name: mycamino-site
    restart: unless-stopped
    env_file: [./mycamino.env]
    volumes:
      - /var/lib/mycamino/database:/data
      - /var/lib/mycamino/releases:/releases:ro
    networks: [public]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8003/health/', headers={'Host': 'localhost', 'X-Forwarded-Proto': 'https'}), timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  public:
    external: true
    name: ${MYCAMINO_PUBLIC_NETWORK:-fedipass_staging_public}
